<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloons By Rori</title>
    <!-- Import Google Font 'Yeseva One' -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">
    
    <style>
        /* Set full background color and ensure body fills the viewport */
        body {
            background-color: #FAE0E5;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        /* Main container to center the logo and H1 together */
        .content {
            margin: auto;
            padding: 20px;
        }

        /* Style and center the logo */
        .logo {
            max-width: 600px; /* Adjust size as needed */
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
        }

        /* Style the H1 with Yeseva One font and center it */
        h1 {
            font-family: 'Yeseva One', serif;
            font-size: 2.5rem;
            color: #333333;
            margin: 0;
        }

        /* Style and center the bottom footer credit */
        footer {
            padding: 20px;
            font-size: 0.9rem;
            color: #555555;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Empty top spacer for balance -->
    <div></div>

    <!-- Center Content: Logo and H1 -->
    <div class="content">
        <img src="websiteballoonsbyrorilogolarge.png" alt="Balloons By Rori Logo" class="logo">
        <h1>Website Under Construction</h1>
    </div>

    <!-- Footer Credit -->
    <footer>
        Powered By Bizsual | South Florida Local Business
    </div>

</body>
</html>
